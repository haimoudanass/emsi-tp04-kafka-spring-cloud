spring.application.name=emsi-tp04-kafka-analytics
server.port=8088

# Broker local (Docker Compose du projet). Surcharger via KAFKA_BROKERS si besoin.
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:9092}

# Fonctions Spring Cloud Stream
spring.cloud.function.definition=visitLogger;visitPulse;visitWindowCount

# Consumer — topic d'entrée manuel / REST
spring.cloud.stream.bindings.visitLogger-in-0.destination=visit-ingress
spring.cloud.stream.bindings.visitLogger-in-0.group=emsi-tp04-visit-logger

# Supplier périodique
spring.cloud.stream.bindings.visitPulse-out-0.destination=visit-pulse
spring.cloud.stream.bindings.visitPulse-out-0.producer.poller.fixed-delay=400

# Kafka Streams — agrégation fenêtrée
spring.cloud.stream.bindings.visitWindowCount-in-0.destination=visit-pulse
spring.cloud.stream.bindings.visitWindowCount-out-0.destination=visit-metrics
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
spring.cloud.stream.kafka.streams.binder.configuration.application.id=emsi-tp04-visit-analytics

# Sérialisation JSON pour les bindings non-Streams
spring.cloud.stream.default.content-type=application/json

logging.level.ma.emsi.tp04.kafka=INFO
logging.level.org.springframework.cloud.stream=INFO
