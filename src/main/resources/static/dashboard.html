<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMSI TP04 — Métriques de visites</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e3a5f, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
    p { color: var(--muted); margin-top: 0; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }
    .card strong { display: block; font-size: 1.8rem; color: var(--accent); }
    .card span { color: var(--muted); font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid #334155; }
    .status { margin-top: 1rem; font-size: 0.9rem; }
    .ok { color: #4ade80; }
    .ko { color: #f87171; }
  </style>
</head>
<body>
  <h1>EMSI TP04 — Analytics Kafka Streams</h1>
  <p>Compteurs de pages (fenêtre ~5 s) via SSE <code>/api/metrics/live</code></p>
  <div class="status" id="status">Connexion…</div>
  <div class="grid" id="cards"></div>
  <table>
    <thead>
      <tr><th>Page</th><th>Visites (fenêtre)</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const cards = document.getElementById('cards');
    const rows = document.getElementById('rows');
    const status = document.getElementById('status');

    function render(data) {
      const entries = Object.entries(data || {}).filter(([k]) => !k.startsWith('_'));
      cards.innerHTML = entries.map(([page, count]) =>
        `<div class="card"><strong>${count}</strong><span>${page}</span></div>`
      ).join('') || '<div class="card"><strong>0</strong><span>aucune donnée</span></div>';
      rows.innerHTML = entries.map(([page, count]) =>
        `<tr><td>${page}</td><td>${count}</td></tr>`
      ).join('');
    }

    const source = new EventSource('/api/metrics/live');
    source.addEventListener('metrics', (event) => {
      status.textContent = 'Flux SSE actif';
      status.className = 'status ok';
      try { render(JSON.parse(event.data)); } catch (e) { /* ignore parse blips */ }
    });
    source.onerror = () => {
      status.textContent = 'SSE interrompu — vérifier Kafka et l’application';
      status.className = 'status ko';
    };
  </script>
</body>
</html>
